# Data Sources Configuration for Business Context Database
# Defines file paths and column mappings for all CSV data sources

# Similarity Calculation Data Sources (Phase 1 - Simplified Architecture)
similarity_calculation:
  # Skills Library for Similarity Calculations
  skills_library:
    file_path: "skills_library/skills_comprehensive_all_versions.csv"
    description: "Comprehensive skills library with all versions for similarity calculations"
    
  # Job-Skill Mapping for Similarity Calculations  
  job_skill_mapping:
    file_path: "input_data/job_skill_mapping.csv"
    description: "Job-skill mapping file for auto-generating job objects in similarity calculations"

data_sources:
  # Job Architecture Data
  jobs:
    file_path: "job_architecture/dummy_job_architecture.csv"
    table_name: "jobs"
    description: "Enhanced job architecture master data with 16-column schema"
    expected_columns:
      - JobProfileID
      - JobProfile
      - JobID
      - Job
      - ProfileTitleSuffix
      - ManagementLevel
      - JobSubFunctionID
      - JobSubFunction
      - JobFunctionID
      - JobFunction
      - JobCategoryID
      - JobCategory
      - "Customer Facing"
      - "is Banker"
      - "Executive Leadership Group"
      - "Accountability Scope"
    column_mapping:
      JobProfileID: JobProfileID
      JobProfile: JobProfile
      JobID: JobID
      Job: Job
      ProfileTitleSuffix: ProfileTitleSuffix
      ManagementLevel: ManagementLevel
      JobSubFunctionID: JobSubFunctionID
      JobSubFunction: JobSubFunction
      JobFunctionID: JobFunctionID
      JobFunction: JobFunction
      JobCategoryID: JobCategoryID
      JobCategory: JobCategory
      "Customer Facing": Customer_Facing
      "is Banker": is_Banker
      "Executive Leadership Group": Executive_Leadership_Group
      "Accountability Scope": Accountability_Scope

  # Skills Library Data
  skills:
    file_path: "skills_library/skills_comprehensive_all_versions.csv"
    table_name: "skills"
    description: "Enhanced comprehensive skills library with 18-column schema"
    expected_columns:
      - id
      - name
      - category_name
      - subcategory_name
      - type_name
      - source_version
      - description
      - infoUrl
    column_mapping:
      id: Skill_ID
      name: Skill_Name
      category_name: Category
      subcategory_name: Subcategory
      type_name: SkillType
      source_version: Latest_Version
      description: Description
      infoUrl: Info_URL
      isLanguage: Is_Language
      category_id: Category_ID
      subcategory_id: Subcategory_ID
      type_id: Type_ID
    default_values:
      Market_Demand: ""
      Rarity_Score: null
    chunk_size: 10000  # Large dataset - process in chunks

  # Job-Skill Mapping Data
  job_skills:
    file_path: "input_data/job_skill_mapping.csv"
    table_name: "job_skills"
    description: "Mapping between jobs and their required skills"
    expected_columns:
      - JobProfileID
      - Skill_ID
    column_mapping:
      JobProfileID: JobProfileID
      Skill_ID: Skill_ID
    default_values:
      Skill_Weight: 1.0

  # Workforce Context Data
  positions:
    file_path: "workforce_context/dummy_workforce_context.csv"
    table_name: "positions"
    description: "Current workforce context and position information with enriched JobProfileID"
    expected_columns:
      - "Position Number"
      - "Position Name"
    optional_columns:
      - "Employee Number"
      - "Business Unit"
      - "ORG_UNIT_NAME_1"  # Enterprise level - single value, can ignore
      - "ORG_UNIT_NAME_2"  # Division
      - "ORG_UNIT_NAME_3"  # Business Unit
      - "ORG_UNIT_NAME_4"  # Team
      - "ORG_UNIT_NAME_5"  # SubTeam
      - "ORG_UNIT_NAME_6"  # Function
      - "ORG_UNIT_NAME_7"  # SubFunction
      - "ORG_UNIT_NAME_8"  # Org Level 8
      - "ORG_UNIT_NAME_9"  # Org Level 9
      - "ORG_UNIT_NAME_10" # Org Level 10
      - "Location"
      - "State/Territory"
      - "Country"
      - "Employment Type"
      - "Salary Group"
      - "Work Pattern"
    column_mapping:
      # Keep original field names
      "Position Number": "Position Number"
      "Position Name": "Position Name"
      "JobProfileID": "JobProfileID"  # Include enriched JobProfileID
      "Employee Number": "Employee Number"
      "Location": "Location"
      "Rg": "Rg"
      "Cty": "Cty"
      "Employee Group": "Employee Group"
      "Salary Group": "Salary Group"
      "Employee Subgroup": "Employee Subgroup"
      # Only rename organisational hierarchy for clarity
      "ORG_UNIT_NAME_2": "Division"
      "ORG_UNIT_NAME_3": "Business_Unit"
      "ORG_UNIT_NAME_4": "Team"
      "ORG_UNIT_NAME_5": "SubTeam"
      "ORG_UNIT_NAME_6": "Function"
      "ORG_UNIT_NAME_7": "SubFunction"
      "ORG_UNIT_NAME_8": "Org_Level_8"
      "ORG_UNIT_NAME_9": "Org_Level_9"
      "ORG_UNIT_NAME_10": "Org_Level_10"
    # Enable position enrichment with job mapping
    enrichment:
      enabled: true
      mapping_file: "job_architecture_to_positions_mapping/position_job_mapping.csv"
      merge_key: "Position Number"
    # Skip derived columns since we're mapping directly from org hierarchy
    data_types:
      "Salary Group": text

# Data Quality Settings
data_quality:
  # Validation rules
  validation:
    allow_empty_strings: true
    max_null_percentage: 10  # Maximum acceptable null percentage per column
    remove_duplicate_keys: true
    
  # Cleaning rules
  cleaning:
    remove_empty_primary_keys: true
    remove_self_references: true  # For similarity data
    validate_similarity_range: [0, 1]  # Similarity scores must be 0-1

# Loading Configuration
loading:
  default_chunk_size: 1000
  large_file_threshold: 10000  # Rows - use chunking above this
  progress_reporting: true
  
  # Foreign key validation
  foreign_key_validation:
    enabled: true
    strict_mode: false  # If true, fail on any FK violations
    
# Error Handling
error_handling:
  continue_on_warnings: true
  max_errors_per_file: 100
  log_skipped_rows: true 