# Main configuration file for the Skill Similarity Engine
# This file contains all settings for the application

# Version information
version: "0.1.0"

# Directory paths
data_dir: "./data"
output_dir: "./output"

# Field mapping configuration
field_mapping_file: "config/field_mapping.yaml"

# Logging settings
logging:
  level: "INFO"
  log_dir: "./logs"
  log_file: "skill_similarity_engine.log"
  console_output: true
  file_output: true
  max_file_size_mb: 10
  backup_count: 5

# Normalisation settings
normalisation:
  # Whether to use min-max scaling for proficiency levels (0-5 -> 0-1)
  use_min_max_scaling: true
  
  # Whether to use boolean normalisation (has/doesn't have skill)
  use_boolean_normalisation: false
  
  # Whether to use TF-IDF style weighting (rare skills get higher weight)
  use_tfidf_weighting: true
  
  # Weights for different skill categories
  importance_weights:
    Technical: 1.0
    Soft: 1.0
    Domain: 1.0
    Methodology: 1.0
    Tool: 1.0
    Certification: 1.0
    Other: 1.0

# Similarity calculation settings
similarity:
  # Similarity calculation method: cosine, euclidean, or jaccard
  method: "cosine"
  
  # Minimum similarity threshold for considering matches (0.0-1.0)
  threshold: 0.7
  
  # Number of top similarity results to return
  top_n_results: 5

# Gap analysis settings
gap_analysis:
  # Minimum ratio of employee's proficiency to required proficiency
  min_proficiency_ratio: 0.65
  
  # Weight given to skill difficulty in development effort
  skill_difficulty_factor: 1.0
  
  # Minimum gap threshold to consider critical in team analysis
  min_gap_threshold: 0.2
  
  # Weights for different skill categories in development effort
  category_weights:
    Technical: 0.6
    Soft: 0.3
    Domain: 0.1
    Methodology: 0.9
    Tool: 0.6
    Certification: 0.5
    Other: 0.5

# Opportunity identification settings
opportunity:
  # Threshold for identifying high similarity opportunities (0.0-1.0)
  high_similarity_threshold: 0.8
  
  # Threshold for identifying low development effort opportunities
  low_gap_threshold: 20.0
  
  # Threshold for identifying good fit opportunities (percentage)
  high_match_percentage: 80.0
  
  # Threshold for identifying critical skill gaps (percentage)
  critical_gap_percentage: 50.0
  
  # Threshold for identifying critical skill gaps (percentage)
  critical_skill_gap_threshold: 0.4

# Report configuration
reporting:
  include_headers: true
  date_format: "%Y-%m-%d"
  float_format: "%.2f"
  include_index: false
  encoding: "utf-8"
  json_indent: 2

# Heatmap visualization settings
heatmaps:
  default_colormap: "viridis"
  default_figsize: [10, 8]
  show_annotations: true
  annotation_format: ".2f"
  line_width: 0.5
  show_colorbar: true
  mask_diagonal: false
  cluster_by_default: false
  dpi: 300

# Team gap analysis settings
team_analysis:
  fully_covered_weight: 1.0
  partially_covered_weight: 0.5
  reskilling_difficulty_levels:
    1: "Very Easy"
    2: "Easy"
    3: "Moderate"
    4: "Difficult"
    5: "Very Difficult"

# Workforce planning settings
workforce:
  critical_skill_threshold: 3.0
  max_skills_in_report: 20
  department_skill_coverage_threshold: 75.0

# Similarity enhancement factors configuration
# This section is loaded from an external file
similarity_enhancement_factors_file: "config/similarity_enhancement_factors.yaml" 