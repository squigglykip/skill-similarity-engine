# HRIS Schema Mapping Configuration
# ==========================================
#
# This configuration file defines the mapping between HRIS system data schema
# and the Skill Similarity Engine's required data format.
# Use this file to customize the data transformation process for your specific HRIS system.

# ==========================================
# FILE PATHS AND FORMATS
# ==========================================

# Source HRIS data files
hris_data:
  jobs_file: data/poc/jobs_data_20250331_175651.csv
  skills_file: data/poc/skills_data_20250331_175651.csv
  job_skills_file: data/poc/job_skills_mapping_20250331_175651.csv

  # File format settings
  file_format: csv
  encoding: utf-8
  delimiter: ','
  has_header: true

# Output transformed data files
output_data:
  jobs_file: "./transformed/jobs.csv"
  skills_file: "./transformed/skills.csv"
  employees_file: "./transformed/employees.csv"

# ==========================================
# COLUMN MAPPINGS - JOBS
# ==========================================

# Map HRIS job data columns to engine job fields
jobs_mapping:
  # Required fields
  job_id: JobID
  title: RoleSet
  department: Org Unit Name
  level: Salary Group

  # Optional fields
  role_track: People Leader Flag
  location: ["Street", "Suburb", "Location", "Cty"]  # Array of location fields to concatenate

# ==========================================
# COLUMN MAPPINGS - SKILLS
# ==========================================

# Map HRIS skill data columns to engine skill fields
skills_mapping:
  # Required fields
  skill_id: Skill_ID
  name: Skill_Name
  
  # Optional fields
  skill_type: SkillType     # Map HRIS SkillType directly to our skill_type
  category: Category        # Map HRIS Category directly to our category
  subcategory: Subcategory  # Map HRIS Subcategory directly to our subcategory
  description: Description  # Map HRIS Description directly to our description
  aliases: Aliases
  related_skills: Related_Skills
  prerequisites: Prerequisites

# ==========================================
# COLUMN MAPPINGS - JOB SKILLS
# ==========================================

# Map HRIS job-skill mapping data columns
job_skills_mapping:
  job_id: JobID
  skill_id: Skill_ID

# ==========================================
# VALUE MAPPINGS AND TRANSFORMATIONS
# ==========================================

# Map HRIS salary group values to engine JobLevel and PSA values
salary_group_mapping:
  "Group 1": 
    level: "ENTRY"
    psa: "ENTRY"
  "Group 2":
    level: "ASSOCIATE"
    psa: "ENTRY"
  "Group 3":
    level: "PROFESSIONAL"
    psa: "MIDRANGE"
  "Group 4":
    level: "PROFESSIONAL"
    psa: "MIDRANGE"
  "Group 5":
    level: "SENIOR"
    psa: "SENIOR"
  "Group 6":
    level: "PRINCIPAL"
    psa: "LEADERSHIP"
  "Group 7":
    level: "EXECUTIVE"
    psa: "EXECUTIVE"

# Map HRIS people leader flag to engine RoleTrack values
role_track_mapping:
  "People Leader": "MANAGEMENT"
  "Non-People Leader": "INDIVIDUAL_CONTRIBUTOR"

# ==========================================
# TRANSFORMATION OPTIONS
# ==========================================

transformation_options:
  # Whether to use binary skill representation (has/doesn't have)
  use_binary_skills: false

  # Default proficiency level when not specified
  default_proficiency: 3

  # Default department when not specified
  default_department: "General"

  # How to handle unknown values
  skip_unknown_values: false
  raise_error_on_unknown_values: false

  # Location formatting
  location_format: "{Street}, {Suburb}, {Location}, {Cty}"  # Format string for location concatenation

  # Skill type mapping - how to transform HRIS skill type values to our internal values
  skill_type_mapping:
    "Common Skill": "COMMON"
    "Specialized Skill": "SPECIALIZED"
    "Certification": "CERTIFICATION"
    "Technical Skill": "SPECIALIZED"
    "Soft Skill": "COMMON"
    "Other": "COMMON"

# ==========================================
# TEXT PROCESSING OPTIONS (for skill extraction)
# ==========================================

text_processing:
  # Natural language processing options for extracting skills from text
  extract_skills_from_text: false
  
  # Fields to extract skills from if skills not explicitly mapped
  extract_from_fields: ["job_description", "responsibilities"]
  
  # Minimum confidence score for extracted skills (0.0-1.0)
  min_confidence: 0.7
  
  # Whether to normalize extracted skill names
  normalize_skill_names: true
  
  # Skill extraction method: keyword, nlp, or regex
  extraction_method: "keyword"

# ==========================================
# LOGGING AND DEBUG OPTIONS
# ==========================================

logging:
  # Log level for HRIS transformation process
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  
  # Whether to log detailed transformation steps
  log_details: true
  
  # Whether to save a mapping report (CSV showing old→new values)
  save_mapping_report: true
  
  # Path for mapping report
  mapping_report_path: "logs/hris_mapping_report.csv" 