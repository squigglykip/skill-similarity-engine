jobs:
  JobProfileID:
    type: string
    required: true
  RoleSet:
    type: string
    required: true
  Salary Group:
    type: string
    required: true
  People Leader Flag:
    type: string
    required: true
  Street:
    type: string
    required: false
  Suburb:
    type: string
    required: false
  Location:
    type: string
    required: false
  Cty:
    type: string
    required: false

job_skill_mapping:
  JobProfileID:
    type: string
    required: true
  Skill_ID:
    type: string
    required: true

# Updated skills schema for comprehensive skills library (skills_comprehensive_all_versions.csv)
skills:
  # Core required fields
  id:
    type: string
    required: true
  name:
    type: string
    required: true
  type_name:
    type: string
    required: false
  
  # Categorization fields (optional since many have nulls)
  category_id:
    type: numeric
    required: false
  category_name:
    type: string
    required: false
  subcategory_id:
    type: numeric
    required: false
  subcategory_name:
    type: string
    required: false
  
  # Metadata fields (mostly optional)
  description:
    type: string
    required: false
  descriptionSource:
    type: string
    required: false
  infoUrl:
    type: string
    required: false
  source_version:
    type: numeric
    required: false
  
  # Boolean flags
  isLanguage:
    type: boolean
    required: false
  isSoftware:
    type: boolean
    required: false
  
  # Type information
  type_id:
    type: string
    required: false
  type:
    type: string  # JSON field
    required: false
    
  # Wikipedia integration (optional)
  tag_wikipediaExtract:
    type: string
    required: false
  tag_wikipediaUrl:
    type: string
    required: false
  tags:
    type: string  # JSON array field
    required: false 