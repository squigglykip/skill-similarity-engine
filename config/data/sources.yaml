# Data Sources Configuration - PRESERVE ALL CSV DATA APPROACH
# Direct CSV-to-Database mapping with minimal transformation
# 
# Philosophy: Raw data is sacred - preserve all information from source systems
# Strategy: Direct column mapping with only essential standardization

data_sources:
  # 1. CORE JOB ARCHITECTURE (16 columns)
  core_job_architecture:
    file_path: "job_architecture/job_architecture.csv"
    table_name: "core_job_architecture"
    description: "Complete job architecture with all 16 CSV columns preserved"
    column_mapping:
      # Direct mapping - preserve everything
      JobID: JobID
      Job: Job
      JobProfileID: JobProfileID                    # PRIMARY KEY
      JobProfile: JobProfile
      ProfileTitleSuffix: ProfileTitleSuffix
      ManagementLevel: ManagementLevel
      JobSubFunctionID: JobSubFunctionID
      JobSubFunction: JobSubFunction
      JobFunctionID: JobFunctionID
      JobFunction: JobFunction
      JobCategoryID: JobCategoryID
      JobCategory: JobCategory
      "Customer Facing": Customer_Facing           # Handle space in column name
      "is Banker": is_Banker                       # Handle space in column name
      "Executive Leadership Group": Executive_Leadership_Group  # Handle spaces
      "Accountability Scope": Accountability_Scope  # Handle space in column name

  # 2. CORE SKILLS TAXONOMY (18 columns)
  core_skills_taxonomy:
    file_path: "skills_library/skills_comprehensive_all_versions.csv"
    table_name: "core_skills_taxonomy"
    description: "Complete skills taxonomy with all 18 CSV columns preserved"
    column_mapping:
      # Direct mapping - preserve everything
      id: Skill_ID                                 # PRIMARY KEY
      name: Skill_Name
      category_id: category_id
      category_name: Category
      description: description
      descriptionSource: descriptionSource
      infoUrl: infoUrl
      isLanguage: isLanguage
      isSoftware: isSoftware
      source_version: source_version
      subcategory_id: subcategory_id
      subcategory_name: Subcategory
      tag_wikipediaExtract: tag_wikipediaExtract
      tag_wikipediaUrl: tag_wikipediaUrl
      tags: tags
      type: type
      type_id: type_id
      type_name: SkillType
    chunk_size: 10000  # Large dataset - process in chunks

  # 3. CORE JOB SKILL REQUIREMENTS (2 columns)
  job_skills:
    file_path: "job_skill_mapping/job_skill_mapping.csv"
    table_name: "core_job_skill_requirements"
    description: "Simple job-skill mapping with both available columns"
    column_mapping:
      # Direct mapping - this is perfect as-is
      JobProfileID: JobProfileID                   # FOREIGN KEY
      Skill_ID: Skill_ID                          # FOREIGN KEY

  # 4. CORE WORKFORCE CURRENT (48 columns + enrichment)
  core_workforce_current:
    file_path: "workforce_context/workforce_context.csv"
    table_name: "core_workforce_current"
    description: "Complete workforce data with all 48 CSV columns + JobProfileID enrichment"
    enrichment:
      # Add JobProfileID using position mapping
      JobProfileID:
        source_file: "job_arch_to_positions_mapping/job_arch_to_positions_mapping.csv"
        mapping_key: "Position Number"
        target_key: "Position_Number"
        value_column: "JobProfileID"
    column_mapping:
      # Direct mapping - preserve everything (48 columns + enriched JobProfileID)
      "Week Ending": Week_Ending
      Bucket: Bucket
      Operational: Operational
      "Position Number": position_number           # PRIMARY KEY for enrichment
      JobProfileID: JobProfileID                   # ENRICHED COLUMN
      "Position Name": position_name
      "FTE (raw value in SAP)": FTE_raw_value_in_SAP
      "Position Start Date": Position_Start_Date
      "People Leader Flag": People_Leader_Flag
      "Salary Group": Salary_Group
      Street: Street
      Suburb: Suburb
      Location: Location
      Rg: Rg
      Cty: Cty
      "Global Region": Global_Region
      "Cost ctr": Cost_ctr
      "Cost Center": Cost_Center
      "Org Unit Number": Org_Unit_Number
      "Org Unit Name": Org_Unit_Name
      # Complete SAP organizational hierarchy
      ORG_UNIT_NO_1: ORG_UNIT_NO_1
      ORG_UNIT_NAME_1: ORG_UNIT_NAME_1
      ORG_UNIT_NO_2: ORG_UNIT_NO_2
      ORG_UNIT_NAME_2: ORG_UNIT_NAME_2
      ORG_UNIT_NO_3: ORG_UNIT_NO_3
      ORG_UNIT_NAME_3: ORG_UNIT_NAME_3
      ORG_UNIT_NO_4: ORG_UNIT_NO_4
      ORG_UNIT_NAME_4: ORG_UNIT_NAME_4
      ORG_UNIT_NO_5: ORG_UNIT_NO_5
      ORG_UNIT_NAME_5: ORG_UNIT_NAME_5
      ORG_UNIT_NO_6: ORG_UNIT_NO_6
      ORG_UNIT_NAME_6: ORG_UNIT_NAME_6
      ORG_UNIT_NO_7: ORG_UNIT_NO_7
      ORG_UNIT_NAME_7: ORG_UNIT_NAME_7
      ORG_UNIT_NO_8: ORG_UNIT_NO_8
      ORG_UNIT_NAME_8: ORG_UNIT_NAME_8
      ORG_UNIT_NO_9: ORG_UNIT_NO_9
      ORG_UNIT_NAME_9: ORG_UNIT_NAME_9
      ORG_UNIT_NO_10: ORG_UNIT_NO_10
      ORG_UNIT_NAME_10: ORG_UNIT_NAME_10
      # Employee details
      "Employee Number": employee_number           # PRIMARY KEY
      "Employee Name": Employee_Name
      "Email Address": Email_Address
      "Gender Key": Gender_Key
      Entry: Entry
      "Employee Group": Employee_Group
      "Employee Subgroup": Employee_Subgroup
      "People Leader Number": People_Leader_Number
      "People Leader Name": People_Leader_Name

  # 5. CORE POSITION TIMELINE (9 columns + enrichment, 5 files)
  position_history:
    file_pattern: "positions_history/d_positions_fy*.csv"
    table_name: "core_position_timeline"
    description: "Complete position timeline with all 9 CSV columns + JobProfileID enrichment"
    enrichment:
      # Add JobProfileID using position mapping
      JobProfileID:
        source_file: "job_arch_to_positions_mapping/job_arch_to_positions_mapping.csv"
        mapping_key: "Position Number"
        target_key: "Position_Number"
        value_column: "JobProfileID"
    primary_key_generation:
      # Generate composite primary key
      position_timeline_id: "Position_Number + '_' + Week_Ending"
    column_mapping:
      # Direct mapping - preserve everything (9 columns + enriched JobProfileID)
      "Week Ending": Week_Ending
      "Position Number": Position_Number
      JobProfileID: JobProfileID                   # ENRICHED COLUMN
      PosIDLookupKey: PosIDLookupKey
      "Organisational Unit": Organisational_Unit
      "Cost Centre Number": Cost_Centre_Number
      "Position Title": Position_Title             # 100% NULL but preserved
      "People Leader": People_Leader
      Operational: Operational
      OrgUnitIDLookupKey: OrgUnitIDLookupKey

  # 6. CORE COLLEAGUE POSITIONS HISTORY (6 columns, 4 files)
  colleague_positions_history:
    file_pattern: "colleague_positions_history/d_colleague_position_fy*.csv"
    table_name: "core_colleague_positions_history"
    description: "Monthly snapshots of colleague position assignments over time (Phase 2 movement analysis)"
    # No primary key generation needed - PosIDLookupKey is already unique
    column_mapping:
      # Direct mapping - preserve raw CSV field names exactly
      "Week Ending": "Week Ending"
      "Employee Number": "Employee Number"
      "Operational": "Operational"
      "Position Start Date": "Position Start Date"
      "PosIDLookupKey": "PosIDLookupKey"
      "Position Number": "Position Number"

# ================================================================================
# ENRICHMENT DATA SOURCES
# ================================================================================

enrichment_sources:
  # Position to JobProfileID mapping
  position_mapping:
    file_path: "job_arch_to_positions_mapping/job_arch_to_positions_mapping.csv"
    description: "Mapping file for enriching workforce and position data with JobProfileID"
    key_columns:
      - Position_Number
      - JobProfileID

# ================================================================================
# DATA PROCESSING CONFIGURATION
# ================================================================================

processing:
  # Column name standardization
  column_standardization:
    remove_quotes: true                            # Remove quotes from column names
    spaces_to_underscores: true                    # Convert spaces to underscores
    preserve_case: true                            # Keep original casing
  
  # Data type handling  
  data_types:
    auto_detect: true                              # Let pandas infer types
    boolean_columns:                               # Explicitly handle boolean
      - Operational
      - isLanguage
      - isSoftware
  
  # Missing data handling
  null_handling:
    preserve_nulls: true                           # Keep NULL values as-is
    document_quality_issues: true                  # Log data quality issues

# ================================================================================
# PHASE 0 LOADING SEQUENCE
# ================================================================================

loading_sequence:
  # Order matters for foreign key relationships
  - core_job_architecture                         # Must load first (referenced by others)
  - core_skills_taxonomy                          # Must load second (referenced by job_skills)
  - job_skills                                    # References both job_architecture and skills
  - core_workforce_current                        # References job_architecture (via enrichment)
  - position_history                              # References job_architecture (via enrichment)
  - colleague_positions_history                   # Phase 2 movement analysis data

# ================================================================================
# QUALITY VALIDATION
# ================================================================================

quality_checks:
  # Expected row counts (for validation)
  expected_rows:
    core_job_architecture: 715
    core_skills_taxonomy: 38430
    job_skills: 40170
    core_workforce_current: 35000
    position_history: 600000                     # Total across 5 files
    colleague_positions_history: 500000          # Total across 4 files (FY22-FY25)
  
  # Data quality documentation
  known_issues:
    position_history:
      Position_Title: "100% NULL across all files - data quality issue from source"
    core_workforce_current:
      People_Leader_Number: "29.8% NULL - normal for non-leadership roles"

