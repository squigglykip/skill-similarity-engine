# =============================================================================
# Models Module - Movement Analysis Configuration
# =============================================================================
# Extracted from architectural_config.yaml - models.movement_analysis section
# Controls movement detection, tracking, and analysis settings

# Progress reporting
progress_reporting_interval: 10000
memory_usage_reporting: true

# Data quality settings
enrichment_rate_calculation: true
enrichment_percentage_multiplier: 100

# File naming patterns
output_files:
  employee_movements_csv: "employee_movements.csv"
  employee_movements_parquet: "employee_movements.parquet"
  movement_summary_csv: "movement_summary.csv"
  movement_summary_parquet: "movement_summary.parquet"
  metadata_json: "metadata.json"

# Date format configurations - INHERIT FROM CORE (NO OVERRIDES ALLOWED)
# All date formats are now managed by config/core/datetime.yaml with absolute authority
# This prevents the date format conflicts that caused ML training failures
date_formats:
  # REFERENCE ONLY - All actual formats come from core/datetime.yaml
  core_authority: "config/core/datetime.yaml"
  override_protection: true
  
  # Core configuration references (use these for documentation only)
  movement_date_format: "${core.datetime.domain_formats.movement_analysis}"
  iso_format: "${core.datetime.primary_formats.output_date}"
  parsing_tolerance: "${core.datetime.parsing_tolerance}"
  
  # Migration note
  migration_note: "Module-specific date formats removed to prevent ML training failures. All date handling now uses core configuration authority."

# Boolean value mappings
boolean_mappings:
  true_values: ["TRUE", "True", "true", "T", "1", "YES", "Yes", "yes", "Y", "y"]
  false_values: ["FALSE", "False", "false", "F", "0", "NO", "No", "no", "N", "n"]
  default_operational_status: true

# File export settings
export_settings:
  # Default formats and settings
  csv_export:
    enabled: true
    index: false
    encoding: "utf-8"
  
  parquet_export:
    enabled: true
    compression: "snappy"
    index: false
    engine: "pyarrow"
  
  excel_export:
    enabled: false
    index: false
    sheet_name: "Sheet1" 