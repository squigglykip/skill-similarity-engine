# ============================================================================= 
# Similarity Module - Algorithms Configuration
# =============================================================================
# Extracted from architectural_config.yaml - similarity_module section
# Controls similarity algorithms, methods, and core parameters

# Core similarity algorithms
default_method: "cosine"
available_methods: ["cosine", "asymmetric", "symmetric", "jaccard", "euclidean"]
fallback_method: "cosine"

# Core algorithm parameters (from similarity section)
default_threshold: 0.5
top_n_results: 12

# Matrix computation settings
symmetric_matrix: false
enable_checkpointing: true
checkpoint_interval: 1000

# Performance optimisation
batch_size: 1000
use_sparse_matrices: false
cache_intermediate_results: true

# =============================================================================
# ENHANCED SIMILARITY ALGORITHMS - NEW SOPHISTICATED METHODS
# =============================================================================
# Based on empirically-tuned parameters from research notebooks
# Results: 0.76% average improvement, 12.5% positive rate, 0.7714 smoothness score

# DEPRECATED - Configuration moved to config/core/similarity_parameters.yaml
# All similarity parameters now use the Optuna-optimized values from core configuration
# 
# Current values (loaded from core config):
#   - defining_skills_percentile: 8.8% (Optuna-optimized)
#   - defining_skills_multiplier: 1.206 (Optuna-optimized)
#   - rarity_thresholds: rare=5.0, uncommon=20.0, common=50.0
#
# To modify these values, edit config/core/similarity_parameters.yaml

rarity_weighted_algorithms:
  enabled: true                         # Feature flag for rarity-weighted algorithms
  # Parameters loaded from config/core/similarity_parameters.yaml - optuna_optimal section

# Backward compatibility - DEPRECATED
enhanced_algorithms:
  enabled: true                         # Feature flag for enhanced algorithms
  # Parameters loaded from config/core/similarity_parameters.yaml - optuna_optimal section
  
hyperparameter_optimization:
  enabled: false                        # Enable for parameter tuning runs
  percentile_thresholds: [10, 15, 20, 25, 30, 35, 40]
  multipliers: [1.05, 1.1, 1.15, 1.2, 1.25, 1.3, 1.4, 1.5]
  sample_size: 10000                    # Job pairs for validation
  smoothness_weights:
    gini_coefficient: 0.3
    coefficient_of_variation: 0.4
    range_ratio: 0.3

# Database integration settings
database_integration:
  extend_job_similarities_table: true   # Add enhanced similarity columns
  preserve_basic_similarity: true       # Maintain backward compatibility
  enhanced_columns:
    - enhanced_similarity_score         # Rarity-weighted + defining skills boost
    - rarity_weighted_score            # Before defining skills boost
    - shared_defining_skills_count     # Count of shared defining skills
    - defining_skill_boost             # Actual boost applied

# =============================================================================
# EXISTING CONFIGURATION - PRESERVED FOR BACKWARD COMPATIBILITY
# =============================================================================

# Asymmetric coverage settings
asymmetric:
  default_top_n_results: 10
  default_similarity_method: "asymmetric"
  alternative_similarity_method: "symmetric"
  exclude_self_comparison: true

# Cosine similarity settings
cosine:
  # Core constants
  max_seniority_difference: 6          # Maximum difference between seniority levels (1-7)
  max_location_similarity: 1.0         # Maximum similarity score for location
  
  # TF-IDF vectorization
  idf_fallback_value: 1.0             # Fallback IDF value for unknown skills
  tf_smoothing_factor: 1               # TF calculation smoothing
  vector_normalization: true           # Normalize vectors after TF-IDF
  
  # Progress reporting
  progress_log_interval: 1000          # Log progress every N jobs processed
  progress_percentage_precision: 1     # Decimal places for progress percentage
  
  # Result limits
  default_top_n_similar_jobs: 5
  default_top_n_similar_employees: 5
  default_top_n_suitable_jobs: 5
  default_top_n_suitable_employees: 5
  
  # Matrix computation
  matrix_chunk_size: 1000              # Chunk size for similarity matrix computation
  enable_vector_caching: true          # Cache computed vectors
  
  # Enhancement weights (delegated to external config)
  use_enhancement_factors: true        # Enable seniority/role/location enhancements
  base_skill_weight: 1.0              # Weight for base skill similarity 