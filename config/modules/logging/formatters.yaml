# =============================================================================
# Logging Module Configuration - Formatters
# =============================================================================
# 
# Extracted from: config/architectural_config.yaml (logging.formatters section)
# Purpose: Log message formatting configuration
# Module: src/logging/
# =============================================================================

# Formatter configuration
formatters:
  # Available formatter types
  available_types: ["console", "detailed", "json"]
  default_formatter: "console"
  
  # Console formatter settings
  console:
    format_string: "%(asctime)s - %(levelname)s - %(message)s"
    date_format: "${core.datetime.primary_formats.logging}"  # Inherit from core
    
  # Detailed formatter settings  
  detailed:
    format_string: "%(asctime)s - %(levelname)s - %(name)s - %(module)s:%(lineno)d - %(message)s"
    date_format: "${core.datetime.primary_formats.logging}"  # Inherit from core
    
  # JSON formatter settings
  json:
    include_fields: ["time", "level", "name", "message", "module", "line"]
    date_format: "${core.datetime.primary_formats.logging}"  # Inherit from core
    ensure_ascii: false
    indent: null
  
  # Core configuration inheritance
  core_inheritance:
    authority: "config/core/datetime.yaml"
    migration_note: "Date formats now inherit from core to prevent inconsistencies" 