[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill_similarity_engine"
version = "0.1.0"
description = "A system for analyzing skill similarities between jobs and employees to identify reskilling opportunities"
readme = "README.md"
authors = [
    {name = "NAB People & Culture Team"}
]
license = {text = "Proprietary"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0,<2.0.0",
    "numpy>=1.20.0,<2.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "seaborn>=0.11.0,<0.13.0",
    "networkx>=2.6.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.0.0,<5.0.0",
    "click>=8.0.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=3.0.0,<4.0.0",
    "mypy>=0.9.0,<1.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
    "black>=22.0.0,<23.0.0",
    "isort>=5.0.0,<6.0.0",
    "flake8>=4.0.0,<5.0.0",
]

[project.scripts]
skill-similarity = "skill_similarity_engine.scripts.run_similarity:main"
skill-reports = "skill_similarity_engine.scripts.generate_reports:main"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=skill_similarity_engine" 