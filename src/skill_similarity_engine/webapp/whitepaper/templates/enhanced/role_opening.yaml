# Enhanced Role Opening Template
# Provides unique, role-specific opening narrative for career opportunities

meta:
  name: "role_opening"
  type: "enhanced_content"
  purpose: "Role-specific opening that avoids generic language"

content: |
  **Career Opportunity #{rank}: {target_job_profile_lead}**
  
  This transition {rank_context} with a {similarity_score:.1%} skill similarity score (ranking in the {percentile_rank:.0f}th percentile of all analyzed pathways).
  
  **Transition Profile**: {source_structure} to {target_structure}
  
  **Skills Alignment**: {shared_count} directly transferable skills with {develop_count} key areas requiring focused development. This represents {quality_level} transition readiness with {development_intensity} development requirements.
  
  **Strategic Context**: {strategic_context}

variables:
  rank:
    description: "Ranking of this opportunity (1, 2, 3)"
    type: "integer"
    
  target_job_profile_lead:
    description: "Lead text for target job profile"
    type: "string"
    
  rank_context:
    description: "Context description based on rank"
    type: "string"
    
  similarity_score:
    description: "Similarity score between roles"
    type: "float"
    
  percentile_rank:
    description: "Percentile ranking of similarity"
    type: "float"
    
  source_structure:
    description: "Complete business structure of source role"
    type: "string"
    
  target_structure:
    description: "Complete business structure of target role"
    type: "string"
    
  shared_count:
    description: "Number of shared skills"
    type: "integer"
    
  develop_count:
    description: "Number of skills to develop"
    type: "integer"
    
  quality_level:
    description: "Quality level of transition readiness"
    type: "string"
    
  development_intensity:
    description: "Description of development intensity"
    type: "string"
    
  strategic_context:
    description: "Strategic context description"
    type: "string" 