# Dynamic descriptor mappings for pathway analysis
descriptors:
  move_type_descriptions:
    "Progression - Same_Role_Higher_Level": "career progression opportunity"
    "Progression - Different_Role_Higher_Level": "career advancement and diversification opportunity"
    "Lateral - Different_Role_Same_Level": "lateral diversification opportunity"
    "Lateral - Same_Role_Same_Level": "specialisation and optimisation opportunity"
    "Transition - Lower_Level": "strategic repositioning opportunity"
    "Other": "strategic transition opportunity"
  
  move_type_displays:
    "Progression - Same_Role_Higher_Level": "Direct Progression"
    "Progression - Different_Role_Higher_Level": "Career Advancement"
    "Lateral - Different_Role_Same_Level": "Lateral Transition"
    "Lateral - Same_Role_Same_Level": "Role Optimisation"
    "Transition - Lower_Level": "Strategic Repositioning"
    "Other": "Strategic Transition"
  
  opportunity_classifications:
    outstanding: "Outstanding Opportunity"
    excellent: "Excellent Opportunity"
    good: "Strong Opportunity"
    development: "Development Opportunity"
    transformation: "Transformation Opportunity"
  
  function_significance:
    major: "significant organisational investment"
    moderate: "moderate organisational focus"
    minor: "specialised capability area"
  
  function_size_assessments:
    major: "substantial"
    moderate: "established"
    minor: "niche"
  
  function_career_infrastructure:
    major: "established career infrastructure"
    moderate: "developing career pathways"
    minor: "limited advancement options"
  
  progression_strategic_assessments:
    natural: "natural career progression step with established precedent"
    strategic: "strategic career move with planned development"
    complex: "complex transition requiring comprehensive support"
  
  progression_complexity_descriptors:
    natural: "reducing approval complexity"
    strategic: "requiring structured planning"
    complex: "necessitating extensive support"
  
  progression_salary_frameworks:
    natural: "clear salary progression frameworks"
    strategic: "structured compensation advancement"
    complex: "customised remuneration planning"

# Threshold configuration for dynamic content selection
thresholds:
  similarity_score:
    outstanding: 85
    excellent: 75
    good: 65
    development: 50
    transformation: 0
  
  function_significance:
    major: 7  # 7%+ of roles
    moderate: 3  # 3-7% of roles
    minor: 0  # <3% of roles
  
  skills_overlap:
    exceptional: 80  # 80%+ overlap
    high: 65        # 65-80% overlap
    moderate: 50    # 50-65% overlap
    development: 0  # <50% overlap 