# Pathway Analysis Template
# Based on whitepaper_example_gold_standard.md lines 122-229

pathway_analysis:
  section_title: "Pathway Analysis: Top 3 Strategic Opportunities"
  
  section_config:
    title: "Pathway Analysis: Top 3 Strategic Opportunities"
    references_start: 57

  # Template for each opportunity (will be rendered 3 times)
  opportunity_template:
    header: |
      ## Opportunity {{opportunity_rank}}: {{target_job_logical_display_name}}
      Similarity Score: {{similarity_score}}% | Classification: {{opportunity_classification}} | Move Type: {{move_type_display}}

    strategic_positioning:
      title: "Why This Makes Sense"
      content_type: "mixed"
      bold_labels: ["Career Impact:", "Business Fit:", "Skills Match:", "Future Prospects:"]
      content: |
        Career Impact: {{target_job_logical_display_name}} offers a {{move_type_description}} with clear advancement potential.

        Business Fit:
        - {{target_job_function}} represents {{function_percentage}}% of NAB roles - a substantial career area with growth opportunities
        - {{level_transition_display}} progression aligns with standard career frameworks
        {% if include_organisational_deployment %}
        - {{target_position_count}} positions available across {{target_division_count}} divisions
        {% endif %}

        Skills Match:
        - {{skills_overlap_percentage}}% of required skills already in place
        - Strong foundation reduces training time and transition risk
        - Skills are in demand across multiple business areas

        Future Prospects:
        - {{primary_skill_category}} skills transfer to other opportunities
        - Builds career resilience and opens future pathways
        - Positions individual for continued growth within NAB

    skills_transition_analysis:
      title: "Skills & Development"
      content_type: "mixed"
      bold_labels: ["What They Already Have:", "What They Need to Learn:", "Development Plan:"]
      content: |
        What They Already Have:
        {{skills_overlap_percentage}}% of required skills are already in place. This strong foundation makes the transition realistic and cost-effective.

        {% for category in transferable_skill_categories %}
        - {{category.name}}: {{category.skill_list}}
        {% endfor %}

        What They Need to Learn:
        {% for skill in required_skills %}
        {{loop.index}}. {{skill.name}} - {{skill.description}}
        {% endfor %}

        Development Plan:
        - Total development time: {{total_development_weeks}} weeks
        - Structured learning: {{specialized_development_weeks}} weeks for new technical skills
        - Applied experience: {{applied_experience_months}} months with mentorship support
        - Approach ensures people can learn while maintaining current role performance

    business_case:
      title: "Business Case for Transition"
      content_type: "mixed"
      bold_labels: ["Strategic Alignment:", "Organisational Benefits:", "Internal Mobility:", "Knowledge Retention:", "Career Progression:", "Capability Building:", "Individual Value Proposition:", "Salary Progression:", "Strategic Exposure:", "Professional Development:", "Career Resilience:"]
      content: |
        Strategic Alignment:
        - {{strategic_alignment_point_1}}
        - {{strategic_alignment_point_2}}
        - {{strategic_alignment_point_3}}

        Organisational Benefits:
        - Internal Mobility: Reduces external recruitment costs (estimated ${{recruitment_cost_estimate}}K+ per senior hire)
        - Knowledge Retention: Maintains institutional knowledge while expanding capability
        - Career Progression: Provides clear advancement pathway for high-performing analysts
        - Capability Building: Strengthens {{capability_building_area}} across multiple business units

        Individual Value Proposition:
        - Salary Progression: {{salary_progression_description}} ({{salary_increase_estimate}}% increase potential)
        - Strategic Exposure: {{strategic_exposure_description}}
        - Professional Development: {{professional_development_description}}
        - Career Resilience: {{career_resilience_description}}

    implementation_roadmap:
      title: "Making It Happen"
      content_type: "mixed"
      bold_labels: ["Timeline:", "Month 1-2: Getting Started", "Month 3-4: Building Skills", "Month 5-6: Applying Learning", "Month 7+: Full Transition"]
      content: |
        Timeline: {{total_transition_weeks}} weeks total from start to full effectiveness in new role

        Month 1-2: Getting Started
        - Individual career conversations and pathway confirmation
        - Skills assessment and personalised development plan
        - Identify mentor and set up support structure

        Month 3-4: Building Skills
        - Focused learning on {{specialized_skills_count}} new technical competencies
        - Structured training programmes and workshops
        - Begin shadowing and observational learning

        Month 5-6: Applying Learning
        - Practical application in current role where possible
        - Cross-functional projects and collaboration
        - Regular check-ins and progress reviews

        Month 7+: Full Transition
        - Formal role transition when ready
        - Ongoing mentorship and support
        - Performance monitoring and adjustment as needed

# Reference mapping for dynamic content (extending current_role_context references)
