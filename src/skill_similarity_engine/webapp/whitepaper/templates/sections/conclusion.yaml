# Conclusion Section Template
# Follows proven YAML template pattern with Jinja2 variable substitution
# Database-driven synthesis for strategic white paper conclusion

conclusion:
  section_config:
    title: "Conclusion"
    references_start: 78
    description: "Strategic synthesis and recommended approach based on database analysis"
  
  content_sections:
    opportunity_summary:
      content: |
        The {{analysis_scope_description}} demonstrates **{{transition_quality_assessment}}** for {{source_job_logical_display_name}}, with {{pathway_count}} pathways offering {{similarity_range_description}} skill similarity and {{progression_value_description}}.
    
    strategic_alignment:
      content: |
        These transitions align with {{strategic_alignment_description}} while providing {{value_proposition_summary}}.
    
    recommended_approach:
      content: |
        **Recommended Approach:** Implement {{implementation_approach}} with {{pilot_size}} {{pilot_scale_descriptor}} across different pathways, using {{scaling_approach}}.
    
    foundation_value:
      content: |
        This analysis provides the foundation for {{foundation_description}}, supporting {{dual_benefit_description}}.

# References section for conclusion
references:
  "78": "SELECT COUNT(*) FROM jobs - Total job profiles in comprehensive analysis"
  "79": "SELECT similarity_score FROM career_pathways WHERE source_job_id = ? ORDER BY similarity_score DESC LIMIT 3 - Top pathway similarity scores"
  "80": "Pathway progression analysis derived from management level and job function comparison" 