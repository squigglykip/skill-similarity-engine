# Good Opportunities Template (0.4-0.7 similarity)
meta:
  name: 'good_opportunities'
  similarity_range: [0.4, 0.7]
  description: 'Good career transition opportunities with moderate similarity'

variables:
  avg_similarity:
    thresholds:
      - range: [0.6, 0.7]
        value: 'strong'
      - range: [0.5, 0.6]
        value: 'moderate'
      - range: [0.4, 0.5]
        value: 'reasonable'

paragraphs:
  executive_summary: |
    Our analysis reveals {avg_similarity} alignment between {source_job_title} and the target opportunity. 
    With {avg_similarity_percent}% compatibility, this transition represents a good career development opportunity 
    that will require focused skills development but offers strong potential for success.

  context_analysis: |
    Based on our analysis of {colleague_count} colleagues currently in {source_job_title} positions, 
    the transition pathway shows {avg_similarity} potential. The skills overlap analysis indicates 
    {skills_shared} transferable skills, with {skills_to_develop} key areas requiring development.

  opportunity_analysis: |
    This career transition offers good prospects with {success_probability_percent}% estimated success probability. 
    The pathway requires moderate investment in skills development but provides solid career advancement potential. 
    Key strengths include {transferable_skills} transferable competencies and established learning pathways.

  skills_development: |
    Success in this transition will require focused development in {skills_to_develop} key skill areas. 
    The recommended development timeline is {timeline_weeks} weeks, with emphasis on bridging the skills gap 
    through targeted training and practical application. Skills retention from current role is estimated at {skill_retention_percent}%.

  implementation_roadmap: |
    We recommend a structured {timeline_weeks}-week development program focusing on the identified skills gaps. 
    This includes formal training, mentoring, and practical application opportunities. Success metrics should 
    be established early, with regular progress reviews to ensure effective transition.
