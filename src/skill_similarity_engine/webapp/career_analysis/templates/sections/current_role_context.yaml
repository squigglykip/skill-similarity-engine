    technical: "technical"
    operational: "operational"
    strategic: "strategic"
    
  transferability:
    high: "broad"
    medium: "moderate"
    low: "limited"
    
  demand_level:
    high: "high"
    medium: "moderate"  
    low: "limited"
    
  function_significance:
    major: "specialised but significant"
    moderate: "focused"
    minor: "niche"
    
  career_progression:
    extensive: "extensive career"
    moderate: "clear career"
    limited: "limited career"
    
  mobility_assessment:
    high: "Medium Hub Potential"
    medium: "Moderate Hub Potential"
    low: "Limited Hub Potential"
    
  transition_readiness_assessment:
    high: "High Readiness"
    medium: "Medium Readiness"
    low: "Development Required"
    
  cross_family_diversity:
    excellent: "Excellent Diversity"
    good: "Good Diversity"
    moderate: "Moderate Diversity"
    limited: "Limited Diversity"
    
  strategic_value_levels:
    HIGH: "Key Position for Workforce Planning"
    MEDIUM: "Valuable Position for Workforce Planning"
    LOW: "Standard Position for Workforce Planning"

