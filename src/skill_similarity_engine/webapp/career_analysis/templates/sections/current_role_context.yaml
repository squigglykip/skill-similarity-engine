# Current Role Context Template
# Based on career_analysis_example_gold_standard.md lines 91-174

current_role_context:
  section_title: "Current Role Context: {{source_job_logical_display_name}}"
  
  section_config:
    title: "Current Role Context: {{source_job_logical_display_name}}"
    references_start: 17

  role_identification:
    title: "Role Analysis Overview"
    content_type: "paragraph"
    content: |
      This analysis focuses on **{{source_job_logical_display_name}}** (Job ID: {{source_job_id}}) within NAB's organisational structure. The following assessment provides comprehensive context for strategic career planning and transition analysis.

  profile_overview:
    title: "{{source_job_logical_display_name}} Profile"
    content_type: "bullet_list"
    bold_labels: ["Organisational Deployment:", "Primary Locations:", "Divisional Distribution:"]
    content: |
      {% if include_organisational_deployment %}
      - Organisational Deployment: {{position_count}} positions across {{division_count}} divisions
      - Primary Locations: {{primary_locations}}
      {% for division in divisional_distribution %}
      - {{division.name}}: {{division.count}} positions ({{division.business_unit}})
      {% endfor %}
      {% endif %}

  core_competency_foundation:
    title: "Core Competency Foundation"
    content_type: "mixed"
    bold_labels: ["{{category.name}} ({{category.skill_count}} skills):"]
    paragraph_intro: "The {{source_job_logical_display_name}} role encompasses {{total_skills}} prescribed skills across {{skill_category_count}} strategic capability areas:"
    skill_categories_list: |
      {% for category in skill_categories %}
      {{category.name}} ({{category.skill_count}} skills): {{category.skill_list}}
      {% endfor %}

  strategic_value_proposition:
    title: "Strategic Value Proposition"
    content_type: "mixed"
    bold_labels: ["Skills Portfolio Analysis:", "Organisational Context:"]
    bold_sub_labels: ["{{total_skills}} prescribed skills", "Skills overlap with", "{{primary_skill_category}} skills", "{{job_function}} function:", "Cross-functional applications:", "Management level distribution:"]
    intro_paragraph: "{{source_job_logical_display_name}}s represent {{role_capability_descriptor}} capability within NAB's workforce structure, as evidenced by:"
    content: |
      Skills Portfolio Analysis:
      - {{total_skills}} prescribed skills across {{skill_category_count}} categories: {{skill_categories_summary}}
      - Skills overlap with {{skills_overlap_job_count}} of {{total_job_count}} jobs indicating {{transferability_descriptor}} transferability across NAB functions
      - {{skill_demand_instances}}

      Organisational Context:
      - {{job_function}} function: {{function_position_count}} positions ({{function_percentage}}% of NAB roles), indicating {{function_significance_descriptor}} capability area
      - Cross-functional applications: Skills appear in {{cross_functional_areas}}
      - Management level distribution: Spans {{management_level_range}}, showing {{career_progression_descriptor}} progression opportunities within {{functional_discipline}} disciplines

  strategic_intelligence_metrics:
    title: "Strategic Intelligence Metrics"
    content_type: "complex_mixed"
    bold_labels: ["About Strategic Intelligence Metrics:", "Important Context:", "Results for {{source_job_logical_display_name}}:", "Mobility Hub Score:", "Transition Readiness:", "Cross-Family Reach:", "Strategic Value:", "Strategic Context Assessment:"]
    bold_sub_labels: ["Mobility Hub Score", "Transition Readiness", "Cross-Family Reach", "Strategic Value"]
    sections:
      overview_intro:
        type: "paragraph"
        content: "About Strategic Intelligence Metrics: These quantitative measures assess workforce positioning and transition potential using analysis of NAB's complete career pathway network. Each metric provides specific intelligence for strategic decision-making:"
      
      metrics_overview:
        type: "bullet_list"
        content: |
          - Mobility Hub Score measures connectivity within the pathway network (0-100%)
          - Transition Readiness indicates average skill overlap with potential career moves
          - Cross-Family Reach counts accessible job functions
          - Strategic Value provides an overall workforce planning assessment

      context_paragraph:
        type: "paragraph"
        content: "Important Context: Our analysis excludes 100% similarity matches, which represent essentially identical roles with different titles. These provide no meaningful transition value as they lack skill development opportunities or career progression. All metrics are benchmarked against NAB's actual distribution of meaningful career transitions."

      results_header:
        type: "paragraph"
        content: "Results for {{source_job_logical_display_name}}:"

      mobility_section:
        type: "mixed"
        header: "Mobility Hub Score: {{mobility_hub_score}}% - {{mobility_hub_assessment}}"
        content: |
          - This score indicates the role's connectivity within NAB's career pathway network, measuring both the number and viability of progression opportunities available from this position
          - A {{mobility_hub_score}}% score positions {{source_job_logical_display_name}} as a {{mobility_strategic_value}}, with {{mobility_pathway_description}} to support effective redeployment during organisational changes

      readiness_section:
        type: "mixed"
        header: "Transition Readiness: {{transition_readiness}}% - {{transition_readiness_assessment}}"
        content: |
          - This metric quantifies how well current role skills transfer to potential career moves, directly impacting training costs and transition timelines
          - A {{transition_readiness}}% readiness score indicates {{transition_investment_descriptor}}, enabling {{transition_timeline_descriptor}} and reducing the financial and time costs typically associated with career transitions

      reach_section:
        type: "mixed"
        header: "Cross-Family Reach: {{cross_family_reach}} connected job functions - {{cross_family_diversity_assessment}}"
        content: |
          - This measures inter-departmental mobility potential across NAB's organisational structure, spanning {{connected_functions_list}}
          - Access to {{cross_family_reach}} different job functions indicates {{organisational_agility_descriptor}}, enabling cross-functional capability building and reducing dependency risks in critical business areas

      value_section:
        type: "mixed"
        header: "Strategic Value: {{strategic_value_assessment}} - {{strategic_value_descriptor}}"
        content: |
          - This composite assessment combines all mobility factors to determine workforce planning priority
          - A {{strategic_value_assessment}} strategic value rating identifies {{source_job_logical_display_name}} positions as {{workforce_planning_priority}}, offering {{investment_return_descriptor}} and {{organisational_resilience_descriptor}}

      conclusion_paragraph:
        type: "paragraph"
        content: "Strategic Context Assessment: The combined metrics profile positions {{source_job_logical_display_name}} as a {{workforce_architecture_significance}}. The convergence of {{key_metric_convergence}} indicates {{workforce_agility_potential}}, making this role particularly valuable during organisational transformations, restructures, or capability realignments."

# Reference mapping for dynamic content (extending executive summary references)
references:
  # Organisational deployment references (17-21)
  17: "SELECT COUNT(DISTINCT p.\"Employee Number\") as position_count, COUNT(DISTINCT p.Division) as division_count FROM positions p JOIN jobs j ON p.JobProfileID = j.JobProfileID WHERE j.JobProfileID = ?"
  18: "SELECT City, COUNT(*) as count FROM positions WHERE JobProfileID = ? GROUP BY City ORDER BY count DESC"
  19: "SELECT Division, COUNT(*) as count FROM positions WHERE JobProfileID = ? GROUP BY Division ORDER BY count DESC"
  20: "SELECT Business_Unit, COUNT(*) as count FROM positions WHERE JobProfileID = ? AND Division = ? GROUP BY Business_Unit"
  21: "SELECT COUNT(*) FROM positions WHERE JobProfileID = ? AND Division = ?"
  
  # Skills portfolio references (22-31)
  22: "SELECT COUNT(DISTINCT js.Skill_ID) FROM job_skills js WHERE js.JobProfileID = ?"
  23: "SELECT COUNT(DISTINCT js.Skill_ID) FROM job_skills js JOIN skills s ON js.Skill_ID = s.Skill_ID WHERE js.JobProfileID = ? AND s.SkillCategory = ?"
  24: "SELECT COUNT(DISTINCT js.Skill_ID) FROM job_skills js JOIN skills s ON js.Skill_ID = s.Skill_ID WHERE js.JobProfileID = ? AND s.SkillCategory = ?"
  25: "SELECT COUNT(DISTINCT js.Skill_ID) FROM job_skills js JOIN skills s ON js.Skill_ID = s.Skill_ID WHERE js.JobProfileID = ? AND s.SkillCategory = ?"
  26: "SELECT COUNT(DISTINCT js.Skill_ID) FROM job_skills js JOIN skills s ON js.Skill_ID = s.Skill_ID WHERE js.JobProfileID = ? AND s.SkillCategory = ?"
  27: "SELECT COUNT(DISTINCT Skill_ID) FROM job_skills"
  28: "SELECT COUNT(DISTINCT j.JobProfileID) FROM jobs j WHERE EXISTS (SELECT 1 FROM job_skills js1 JOIN job_skills js2 ON js1.Skill_ID = js2.Skill_ID WHERE js1.JobProfileID = ? AND js2.JobProfileID = j.JobProfileID AND js1.JobProfileID != js2.JobProfileID)"
  29: "Transferability assessment derived from skills overlap analysis"
  30: "SELECT COUNT(*) FROM job_skills js JOIN skills s ON js.Skill_ID = s.Skill_ID WHERE s.SkillCategory = ?"
  31: "Demand level assessment derived from skill frequency analysis"
  
  # Organisational context references (32-46)
  32: "SELECT COUNT(*) FROM jobs WHERE JobFunction = ?"
  33: "Function significance assessment derived from position count analysis"
  34: "SELECT COUNT(*) FROM jobs WHERE JobFunction = 'Operations & Processing'"
  35: "SELECT COUNT(*) FROM jobs WHERE JobFunction = 'Risk Management'"
  36: "SELECT COUNT(*) FROM jobs WHERE JobFunction = 'Finance & Treasury'"
  37: "SELECT DISTINCT ManagementLevel FROM jobs WHERE JobFunction = ? ORDER BY ManagementLevel"
  38: "Career progression assessment derived from management level analysis"
  
  # Strategic intelligence metrics references (47-56)
  47: "Mobility Hub Score algorithmic calculation based on career pathway connectivity"
  48: "Mobility assessment interpretation based on connectivity score"
  49: "Transition Readiness algorithmic calculation based on skills transferability"
  50: "Transition intelligence interpretation based on readiness score"
  51: "Cross-Family Reach algorithmic calculation based on inter-functional pathways"
  52: "Connected functions analysis derived from cross-functional pathway mapping"
  53: "Strategic Value composite assessment algorithm"
  54: "Workforce planning priority determination based on composite metrics"
  55: "Workforce architecture significance assessment"
  56: "Strategic development investment justification framework"

