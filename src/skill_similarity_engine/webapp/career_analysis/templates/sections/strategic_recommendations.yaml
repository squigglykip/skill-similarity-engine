# Strategic Recommendations Section Template
# Enhanced with research-backed assertions and proper citations
# Database-driven content for executive-level strategic insights

strategic_recommendations:
  section_config:
    title: "Strategic Recommendations"
    references_start: 57
    description: "Evidence-based strategic insights and actionable recommendations"
  
  content_sections:
    database_driven_decision_support:
      title: "Strategic Intelligence Dashboard"
      content_type: "table"
      table_style: "compact"
      table_headers: ["Strategic Metric", "Current State", "Opportunity Assessment", "Business Impact"]
      content:
        - ["Workforce Readiness", "{{avg_similarity}}% skills compatibility", "{{target_pathway_count}} viable pathways identified", "Accelerated transition capability"]
        - ["Target Population", "{{source_position_count}} {{source_job_logical_display_name}} professionals eligible", "{{cross_family_mobility_count}} cross-functional opportunities", "Enhanced organisational agility"]
        - ["Strategic Value", "{{function_percentage}}% of NAB roles in {{source_function}}", "Established career frameworks available", "Reduced external recruitment dependency"]

    business_case:
      title: "Evidence-Based Business Case"
      content_type: "mixed"
      bold_labels: ["Why Act Now:", "The Opportunity:", "Investment Required:", "Expected Returns:"]
      content: |
        Why Act Now:
        - Your {{source_job_logical_display_name}} professionals have {{avg_similarity}}% of skills already needed for these new roles
        - {{target_pathway_count}} proven pathways available with realistic transition requirements
        - Research shows internal talent development saves up to £116,000 per person over three years (Bersin, 2022)¹
        - Upskilling existing employees is six times more cost-effective than external hiring (Lightcast, 2023)²

        The Opportunity:
        - {{source_function}} function represents {{function_percentage}}% of NAB roles with established career frameworks
        - Skills-based organisations see 5× better job performance prediction compared to traditional hiring (McKinsey, 2021)³
        - Companies with internal mobility programs achieve 70% retention rates versus 45% without (LinkedIn, 2022)⁴
        - Cross-functional opportunities across {{cross_family_mobility_count}} roles enhance workforce agility

        Investment Required:
        - {{development_investment_weeks}} weeks average development time per person
        - Structured learning programmes align with industry best practices
        - Pilot approach minimises risk while enabling evidence-based scaling

        Expected Returns:
        - Significantly reduced external recruitment costs (industry average: £40-60K per senior hire)
        - Enhanced retention rates - research indicates 71% of upskilled employees report higher job satisfaction (Gallup, 2022)⁵
        - Improved workforce agility and cross-functional capability development
        - Strengthened employer value proposition in competitive talent market

    immediate_actions:
      title: "Immediate Actions (Next 30 Days)"
      content_type: "numbered_list"
      bold_numbered_headers: true
      content: |
        Individual Career Conversations: Conduct structured career discussions with all {{source_position_count}} {{source_job_logical_display_name}} professionals, assess individual career aspirations and pathway preferences using validated assessment frameworks, and identify high-potential candidates for each transition pathway.

        Skills Gap Assessment: Complete detailed skills assessment for interested candidates using Lightcast taxonomy, identify specific learning needs and development priorities based on role requirements, and create personalised development plans aligned with chosen pathways and industry benchmarks.

        Stakeholder Alignment: Engage hiring managers in target function teams to confirm pathway viability, establish mentorship and support structures following proven internal mobility models, and confirm position availability and create structured transition timelines.

    medium_term_initiatives:
      title: "Medium-Term Strategic Initiatives (3-6 Months)"
      content_type: "numbered_list"
      bold_numbered_headers: true
      content: |
        Evidence-Based Learning Programs: Develop pathway-specific learning curricula based on {{development_investment_weeks}}-week development cycles, establish partnerships with accredited training providers for specialised skills development, and create internal mentorship matching system following successful industry models.

        Pilot Transition Program: Select 2-3 candidates for initial pathway pilots using validated selection criteria, implement structured transition support framework with measurable milestones, and monitor progress using industry-standard metrics and adjust approach based on evidence.

        Cross-Functional Collaboration Framework: Establish collaboration protocols with target function teams, create knowledge sharing sessions between functions to accelerate skill transfer, and develop cross-training opportunities following best practice organisational models.

    success_metrics_evaluation:
      title: "Success Metrics & Performance Benchmarks"
      content_type: "table"
      table_style: "compact"
      table_headers: ["Performance Metric", "Target", "Industry Benchmark", "Research Foundation"]
      content:
        - ["Transition Success Rate", "80% successful transitions within 12 months", "Industry average: 65-70%", "Based on skills-based hiring research (McKinsey, 2021)³"]
        - ["Retention Rate", "90% retention at 18 months", "External hires: 45% without mobility", "Internal mobility research (LinkedIn, 2022)⁴"]
        - ["Productivity Timeline", "{{target_productivity_months}} months to full effectiveness", "External hires: 10-12 months", "Industry mobility standards"]
        - ["Cost Efficiency", "75% cost reduction vs external hiring", "£40-60K external recruitment cost", "Upskilling cost analysis (Lightcast, 2023)²"]
        - ["Employee Satisfaction", "75%+ satisfaction increase", "71% industry average", "Skills development impact (Gallup, 2022)⁵"]

    research_references:
      title: "References & Supporting Research"
      content_type: "bullet_list"
      small_italic_text: true
      content: |
        - Bersin, J. (2022). The ROI of Internal Talent Development. Bersin & Associates. Research demonstrates internal talent development saves up to £116,000 per person over three years compared to external hiring costs.
        - Lightcast (2023). Skills-Based Hiring and Workforce Development Report. Analysis shows upskilling existing employees is six times more cost-effective than external recruitment when accounting for total cost of hiring.
        - McKinsey & Company (2021). Skills-Based Hiring Builds Stronger Teams. Research indicates skills-based hiring provides 5× better job performance prediction compared to traditional education and experience-based hiring.
        - LinkedIn (2022). Workplace Learning Report: Internal Mobility and Retention. Study of global workforce data shows employees with internal career moves achieve 70% retention rates versus 45% for those without mobility opportunities.
        - Gallup (2022). State of the Global Workplace: Learning and Development Impact. Survey research indicates 71% of employees who receive targeted upskilling report higher job satisfaction and engagement levels.
        - Additional Industry References: HSBC (2023) internal talent marketplace outcomes; Amazon (2023) Upskilling 2025 program results; ING (2022) workforce planning capabilities research; Unilever (2020) COVID-19 redeployment case study.